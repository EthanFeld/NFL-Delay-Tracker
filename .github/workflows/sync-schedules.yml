name: Sync NFL Delay Tracker schedules

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: write

concurrency:
  group: live-data-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      GAME_OVERRIDES_JSON: ${{ secrets.GAME_OVERRIDES_JSON }}
      NWS_CONTACT_EMAIL: ${{ secrets.NWS_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[glm]'
      - run: python -m nfl_delay_tracker.cli sync-schedules --days 14
      - run: python -m nfl_delay_tracker.cli refresh-forecasts --horizon-hours 48 --simulations 20000
      - name: Publish JSON-only live-data branch
        shell: bash
        run: |
          tar -C data -cf /tmp/nfl-delay-tracker-data.tar .
          git switch --orphan live-data
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p data
          tar -C data -xf /tmp/nfl-delay-tracker-data.tar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Publish NFL Delay Tracker snapshots"
          git push --force origin HEAD:live-data
