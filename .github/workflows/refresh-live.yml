name: Refresh NFL Delay Tracker live scores

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: live-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GAME_OVERRIDES_JSON: ${{ secrets.GAME_OVERRIDES_JSON }}
      NWS_CONTACT_EMAIL: ${{ secrets.NWS_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[glm]'
      - name: Restore published schedule
        shell: bash
        run: |
          git fetch origin live-data:refs/remotes/origin/live-data || true
          if git show-ref --quiet refs/remotes/origin/live-data; then
            mkdir -p /tmp/nfl-delay-previous
            git archive origin/live-data data | tar -x -C /tmp/nfl-delay-previous
            cp -R /tmp/nfl-delay-previous/data/. data/
          fi
      - run: python -m nfl_delay_tracker.cli refresh-live --days 3
      - run: python -m nfl_delay_tracker.cli refresh-forecasts --horizon-hours 48 --simulations 20000 --skip-href --skip-hrrr
      - name: Publish JSON-only live-data branch
        shell: bash
        run: |
          tar -C data -cf /tmp/nfl-delay-tracker-data.tar .
          git switch --orphan live-data
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p data
          tar -C data -xf /tmp/nfl-delay-tracker-data.tar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Publish NFL Delay Tracker live snapshots"
          git push --force origin HEAD:live-data
