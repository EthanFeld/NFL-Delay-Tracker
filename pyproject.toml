[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nfl-delay-tracker"
version = "0.1.0"
description = "NFL Delay Tracker experimental weather delay forecasts and backtests"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "tzdata>=2025.2",
  "eccodes>=2.42,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2", "jsonschema>=4.23,<5", "types-PyYAML>=6.0,<7"]
glm = ["netCDF4>=1.7.2,<2"]

[project.scripts]
nfl-delay-tracker = "nfl_delay_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_delay_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["nfl_delay_tracker"]
